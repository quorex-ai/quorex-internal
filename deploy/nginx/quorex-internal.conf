# Reverse proxy nginx pour quorex-internal.
#
#   cp deploy/nginx/quorex-internal.conf /etc/nginx/sites-available/quorex-internal
#   ln -sf /etc/nginx/sites-available/quorex-internal /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d internal.quorex.fr     # ajoute le bloc HTTPS et le renouvellement
#
# L'application écoute uniquement sur 127.0.0.1:4317 : elle n'est jamais jointe
# directement depuis l'extérieur.

server {
    listen 80;
    listen [::]:80;
    server_name internal.quorex.fr;

    # Le coffre accepte des fichiers de 25 Mo ; sans cette ligne nginx coupe à 1 Mo.
    client_max_body_size 30M;

    # Outil interne : on ne veut pas être indexé.
    add_header X-Robots-Tag "noindex, nofollow, noarchive" always;

    location / {
        proxy_pass http://127.0.0.1:4317;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Un téléchargement du coffre peut être long : on laisse le temps.
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
